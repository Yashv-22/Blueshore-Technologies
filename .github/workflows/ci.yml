name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        env:
          DJANGO_SECRET_KEY: 'ci-secret-key-testing-only-min-50-characters-long'
          DJANGO_DEBUG: 'True'
          USE_POSTGRES: 'False'
          USE_REDIS: 'False'
        run: |
          python manage.py check

      - name: Check Unapplied Migrations
        env:
          DJANGO_SECRET_KEY: 'ci-secret-key-testing-only-min-50-characters-long'
          DJANGO_DEBUG: 'True'
          USE_POSTGRES: 'False'
          USE_REDIS: 'False'
        run: |
          python manage.py makemigrations --check

      - name: Run Test Suite
        env:
          DJANGO_SECRET_KEY: 'ci-secret-key-testing-only-min-50-characters-long'
          DJANGO_DEBUG: 'True'
          USE_POSTGRES: 'False'
          USE_REDIS: 'False'
        run: |
          python manage.py test
