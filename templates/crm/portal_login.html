<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Login - Blueshore Technologies</title>
    <!-- Load Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Visual background blobs -->
    <div class="absolute -left-32 -bottom-32 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl"></div>
    <div class="absolute -right-32 -top-32 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>

    <!-- Login card wrapper -->
    <div class="w-full max-w-md p-8 bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-3xl shadow-2xl relative z-10 space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 text-[11px] font-semibold uppercase tracking-wider">
                <i data-lucide="lock" class="w-3.5 h-3.5"></i> Secure Access
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Client Portal</h1>
            <p class="text-xs text-slate-400">Sign in to track project sprints, approve proposals, and view invoices.</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-xl p-3 flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">Username</label>
                <div class="relative">
                    <input type="text" id="username" name="username" required
                           class="w-full pl-10 pr-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors"
                           placeholder="Enter your username">
                    <i data-lucide="user" class="absolute left-3.5 top-3.5 w-4 h-4 text-slate-500"></i>
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                           class="w-full pl-10 pr-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors"
                           placeholder="••••••••">
                    <i data-lucide="key" class="absolute left-3.5 top-3.5 w-4 h-4 text-slate-500"></i>
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-600/20 transition duration-150 flex items-center justify-center gap-2">
                <span>Sign In to Portal</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="/" class="text-[10px] text-slate-500 hover:text-slate-300 font-semibold transition flex items-center justify-center gap-1">
                <i data-lucide="home" class="w-3.5 h-3.5"></i> Back to Homepage
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
    
    <script src="/assets/visitor-telemetry.js" defer></script>
</body>
</html>
