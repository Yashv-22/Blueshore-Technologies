<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <!-- Definitions for gradients and shadows -->
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDFDFD" />
            <stop offset="100%" stop-color="#F0FDF4" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3B82F6" />
            <stop offset="100%" stop-color="#60A5FA" />
        </linearGradient>
        <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.04" />
        </filter>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
        </filter>
    </defs>

    <!-- Background Canvas -->
    <rect width="800" height="600" rx="16" fill="url(#bgGrad)" />

    <!-- Left Navigation Sidebar -->
    <rect x="0" y="0" width="180" height="600" rx="16" fill="#FFFFFF" filter="url(#shadow)" />
    
    <!-- Sidebar Branding (Healthcare/Heart icon type) -->
    <rect x="28" y="28" width="24" height="24" rx="6" fill="url(#accentGrad)" />
    <path d="M40 34 V46 M34 40 H46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <rect x="62" y="32" width="80" height="8" rx="4" fill="#0F172A" />
    <rect x="62" y="44" width="50" height="5" rx="2" fill="#94A3B8" />

    <!-- Sidebar Menu Items -->
    <g transform="translate(20, 90)">
        <!-- Patients Portal (Active) -->
        <rect x="0" y="0" width="140" height="32" rx="8" fill="#ECFDF5" />
        <rect x="8" y="8" width="16" height="16" rx="4" fill="#10B981" />
        <rect x="36" y="12" width="75" height="8" rx="4" fill="#059669" />
        
        <!-- Video Consultations -->
        <g transform="translate(0, 44)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="65" height="8" rx="4" fill="#64748B" />
        </g>
        
        <!-- Symptom Analyzer -->
        <g transform="translate(0, 80)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="70" height="8" rx="4" fill="#64748B" />
        </g>

        <!-- Electronic Records (EHR) -->
        <g transform="translate(0, 116)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="55" height="8" rx="4" fill="#64748B" />
        </g>

        <!-- Compliance & Security -->
        <g transform="translate(0, 152)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="75" height="8" rx="4" fill="#64748B" />
        </g>
    </g>

    <!-- Top Navigation Header -->
    <rect x="180" y="0" width="620" height="70" fill="#FFFFFF" filter="url(#shadow)" />
    <!-- Page Title -->
    <text x="210" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Clinical Care Dashboard</text>
    <!-- HIPAA Compliance Badge -->
    <rect x="420" y="24" width="120" height="22" rx="11" fill="#EEF2F6" />
    <path d="M430 35 L434 39 L442 31" stroke="#3B82F6" stroke-width="2" fill="none" />
    <text x="448" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#3B82F6">HIPAA COMPLIANT</text>

    <!-- Main Content Area Grid -->
    
    <!-- Row 1: Healthcare KPI Stats -->
    <g transform="translate(200, 90)">
        <!-- Card 1: Patients Triaged -->
        <g transform="translate(10, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Active Consultations</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">2,410,250</text>
            <rect x="130" y="16" width="34" height="48" rx="6" fill="#ECFDF5" />
            <path d="M147 28 L138 44 H156 Z" fill="#10B981" transform="rotate(180 147 36)" />
        </g>

        <!-- Card 2: Consultation Velocity -->
        <g transform="translate(205, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Triage Speed</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#10B981">3.2x Faster</text>
            <circle cx="147" cy="40" r="18" fill="#ECFDF5" />
            <path d="M147 28 V52 M138 37 L147 28 L156 37" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none" />
        </g>

        <!-- Card 3: Satisfaction Index -->
        <g transform="translate(400, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Patient Satisfaction</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">99.4%</text>
            <circle cx="147" cy="40" r="18" fill="#FEF3C7" />
            <text x="139" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#D97706">★</text>
        </g>
    </g>

    <!-- Row 2: Live Doctor Video Consultation Mockup Panel -->
    <g transform="translate(210, 190)" filter="url(#cardShadow)">
        <rect width="570" height="240" rx="12" fill="#FFFFFF" />
        <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">AI-Assisted Diagnostics &amp; Patient Video Consultation Queue</text>
        
        <!-- Left Side: Interactive Queue -->
        <g transform="translate(20, 50)">
            <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#64748B">INCOMING CONSULTATIONS</text>
            
            <!-- Patient 1 -->
            <g transform="translate(0, 25)">
                <rect width="240" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
                <circle cx="20" cy="20" r="12" fill="#E2E8F0" />
                <rect x="40" y="12" width="80" height="6" rx="3" fill="#0F172A" />
                <rect x="40" y="22" width="110" height="4" rx="2" fill="#94A3B8" />
                <rect x="180" y="10" width="50" height="20" rx="10" fill="#FEE2E2" />
                <text x="192" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#EF4444">HIGH</text>
            </g>
            
            <!-- Patient 2 -->
            <g transform="translate(0, 75)">
                <rect width="240" height="40" rx="6" fill="#F8FAFC" />
                <circle cx="20" cy="20" r="12" fill="#E2E8F0" />
                <rect x="40" y="12" width="70" height="6" rx="3" fill="#0F172A" />
                <rect x="40" y="22" width="80" height="4" rx="2" fill="#94A3B8" />
                <rect x="180" y="10" width="50" height="20" rx="10" fill="#FEF3C7" />
                <text x="192" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#D97706">MEDIUM</text>
            </g>

            <!-- Patient 3 -->
            <g transform="translate(0, 125)">
                <rect width="240" height="40" rx="6" fill="#F8FAFC" />
                <circle cx="20" cy="20" r="12" fill="#E2E8F0" />
                <rect x="40" y="12" width="90" height="6" rx="3" fill="#0F172A" />
                <rect x="40" y="22" width="70" height="4" rx="2" fill="#94A3B8" />
                <rect x="180" y="10" width="50" height="20" rx="10" fill="#ECFDF5" />
                <text x="195" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#10B981">LOW</text>
            </g>
        </g>

        <!-- Right Side: Clinician Active Call Mockup -->
        <g transform="translate(290, 50)">
            <rect width="260" height="165" rx="10" fill="#0F172A" />
            <!-- Camera Feed Placeholders -->
            <rect x="10" y="10" width="240" height="145" rx="8" fill="#1E293B" />
            
            <!-- Video Overlay (Doctor mockup symbol) -->
            <circle cx="130" cy="70" r="28" fill="#334155" />
            <path d="M106 120 C106 100 114 90 130 90 C146 90 154 100 154 120 Z" fill="#334155" />
            <circle cx="130" cy="70" r="20" fill="#475569" />
            <path d="M112 120 C112 105 118 97 130 97 C142 97 148 105 148 120 Z" fill="#475569" />

            <!-- Remote Patient view (Inset picture-in-picture) -->
            <rect x="180" y="100" width="60" height="45" rx="4" fill="#334155" stroke="#475569" stroke-width="2" />
            <circle cx="210" cy="115" r="8" fill="#475569" />
            
            <!-- Control HUD overlay -->
            <rect x="65" y="125" width="130" height="20" rx="10" fill="#0F172A" fill-opacity="0.8" />
            <circle cx="80" cy="135" r="6" fill="#EF4444" />
            <circle cx="100" cy="135" r="6" fill="#3B82F6" />
            <circle cx="120" cy="135" r="6" fill="#10B981" />
            <rect x="140" y="132" width="40" height="6" rx="3" fill="#FFFFFF" />
        </g>
    </g>

    <!-- Row 3: Daily Triage Analytics Line Chart Panel -->
    <g transform="translate(210, 450)" filter="url(#cardShadow)">
        <rect width="570" height="130" rx="12" fill="#FFFFFF" />
        <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Daily Diagnostic Consultation Load (AI vs Manual Triage)</text>
        
        <!-- Smooth Area Chart (AI triage) -->
        <path d="M30 95 Q 110 70 190 85 T 350 45 T 510 60 L 550 35" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />
        <path d="M30 95 Q 110 70 190 85 T 350 45 T 510 60 L 550 35 L 550 115 L 30 115 Z" fill="url(#chartGrad)" />
        
        <!-- Grid overlay -->
        <line x1="30" y1="115" x2="550" y2="115" stroke="#E2E8F0" stroke-width="1.5" />
        <line x1="30" y1="75" x2="550" y2="75" stroke="#F1F5F9" stroke-width="1" />
        <line x1="30" y1="45" x2="550" y2="45" stroke="#F1F5F9" stroke-width="1" />

        <circle cx="350" cy="45" r="4.5" fill="#059669" />
        <circle cx="550" cy="35" r="4.5" fill="#10B981" />
    </g>
</svg>
