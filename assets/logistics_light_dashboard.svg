<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <!-- Definitions for gradients and shadows -->
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC" />
            <stop offset="100%" stop-color="#E2E8F0" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284C7" />
            <stop offset="100%" stop-color="#0EA5E9" />
        </linearGradient>
        <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.0" />
        </linearGradient>
        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#34D399" />
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
        </filter>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
        </filter>
    </defs>

    <!-- Background Canvas -->
    <rect width="800" height="600" rx="16" fill="url(#bgGrad)" />

    <!-- Left Navigation Sidebar -->
    <rect x="0" y="0" width="180" height="600" rx="16" fill="#FFFFFF" filter="url(#shadow)" />
    
    <!-- Sidebar Branding -->
    <circle cx="40" cy="40" r="12" fill="url(#accentGrad)" />
    <rect x="60" y="32" width="80" height="8" rx="4" fill="#0F172A" />
    <rect x="60" y="44" width="50" height="5" rx="2" fill="#64748B" />

    <!-- Sidebar Menu Items -->
    <g transform="translate(20, 90)">
        <!-- Dashboard (Active) -->
        <rect x="0" y="0" width="140" height="32" rx="8" fill="#F0F9FF" />
        <rect x="8" y="8" width="16" height="16" rx="4" fill="#0EA5E9" />
        <rect x="36" y="12" width="70" height="8" rx="4" fill="#0284C7" />
        
        <!-- Shipments -->
        <g transform="translate(0, 44)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="60" height="8" rx="4" fill="#64748B" />
        </g>
        
        <!-- Fleet -->
        <g transform="translate(0, 80)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="50" height="8" rx="4" fill="#64748B" />
        </g>

        <!-- Warehouses -->
        <g transform="translate(0, 116)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="65" height="8" rx="4" fill="#64748B" />
        </g>

        <!-- Settings -->
        <g transform="translate(0, 420)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="50" height="8" rx="4" fill="#64748B" />
        </g>
    </g>

    <!-- Top Navigation Header -->
    <rect x="180" y="0" width="620" height="70" fill="#FFFFFF" filter="url(#shadow)" />
    <!-- Page Title -->
    <text x="210" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Logistics Control Tower</text>
    <!-- Live Badge -->
    <rect x="420" y="26" width="50" height="18" rx="9" fill="#ECFDF5" />
    <circle cx="430" cy="35" r="4" fill="#10B981" />
    <text x="440" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#047857">LIVE</text>

    <!-- Main Content Area Grid -->
    
    <!-- Row 1: KPI Stats Cards -->
    <g transform="translate(200, 90)">
        <!-- Card 1: Active Fleet -->
        <g transform="translate(10, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Active Shipments</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">14,820</text>
            <rect x="130" y="16" width="34" height="48" rx="6" fill="#F0F9FF" />
            <path d="M147 28 L138 44 H156 Z" fill="#0EA5E9" />
        </g>

        <!-- Card 2: On-Time Rate -->
        <g transform="translate(205, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">On-Time Performance</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#10B981">99.8%</text>
            <circle cx="147" cy="40" r="18" fill="#ECFDF5" />
            <path d="M141 40 L145 44 L153 36" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </g>

        <!-- Card 3: Direct Savings -->
        <g transform="translate(400, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Annualized Savings</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">$2.4M</text>
            <circle cx="147" cy="40" r="18" fill="#FFFBEB" />
            <text x="143" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#F59E0B">$</text>
        </g>
    </g>

    <!-- Row 2: Global Telemetry Route Map Panel -->
    <g transform="translate(210, 190)" filter="url(#cardShadow)">
        <rect width="570" height="240" rx="12" fill="#FFFFFF" />
        <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Global Route Optimization Telemetry</text>
        
        <!-- Stylized Map Visualizer -->
        <rect x="20" y="50" width="530" height="170" rx="8" fill="#F8FAFC" />
        
        <!-- Continent outlines (Simplified Vector Art) -->
        <path d="M50 80 Q70 60 110 70 T150 90 T180 70 T200 90 T120 130 Z" fill="#E2E8F0" />
        <path d="M300 70 Q350 50 400 60 T480 80 T520 70 T480 120 T380 140 Z" fill="#E2E8F0" />
        <path d="M80 130 Q100 150 120 170 T150 190 T130 210 Z" fill="#E2E8F0" />

        <!-- Nodes and Active Shipment Curves -->
        <!-- North America Node -->
        <circle cx="120" cy="85" r="5" fill="#0EA5E9" />
        <circle cx="120" cy="85" r="9" fill="none" stroke="#0EA5E9" stroke-opacity="0.5" stroke-width="1.5" />
        
        <!-- Europe Node -->
        <circle cx="350" cy="80" r="5" fill="#0EA5E9" />
        <circle cx="350" cy="80" r="9" fill="none" stroke="#0EA5E9" stroke-opacity="0.5" stroke-width="1.5" />
        
        <!-- Asia Node -->
        <circle cx="460" cy="95" r="5" fill="#10B981" />
        <circle cx="460" cy="95" r="9" fill="none" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5" />

        <!-- Connecting Curved Active Shipments -->
        <path d="M120 85 Q235 40 350 80" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6,4" />
        <path d="M350 80 Q405 70 460 95" fill="none" stroke="url(#greenGrad)" stroke-width="3" />
        <path d="M120 85 Q290 140 460 95" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6" />

        <!-- Dynamic Transit Status -->
        <g transform="translate(420, 160)">
            <rect width="120" height="24" rx="6" fill="#FFFFFF" filter="url(#cardShadow)" />
            <circle cx="12" cy="12" r="4" fill="#10B981" />
            <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#0F172A">TRANSIT SAFE</text>
        </g>
    </g>

    <!-- Row 3: Shipment Analytics Volume Panel -->
    <g transform="translate(210, 450)" filter="url(#cardShadow)">
        <rect width="570" height="130" rx="12" fill="#FFFFFF" />
        <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Cloud Migration Traffic Performance (Volume vs Latency)</text>
        
        <!-- Sparkline Chart -->
        <path d="M30 100 L 110 85 L 190 92 L 270 70 L 350 78 L 430 55 L 510 65 L 550 48" fill="none" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" />
        <path d="M30 100 L 110 85 L 190 92 L 270 70 L 350 78 L 430 55 L 510 65 L 550 48 L 550 115 L 30 115 Z" fill="url(#chartGrad)" />
        
        <!-- Baseline Grid Lines -->
        <line x1="30" y1="115" x2="550" y2="115" stroke="#E2E8F0" stroke-width="1.5" />
        <line x1="30" y1="85" x2="550" y2="85" stroke="#F1F5F9" stroke-width="1" />
        <line x1="30" y1="55" x2="550" y2="55" stroke="#F1F5F9" stroke-width="1" />

        <!-- Chart Markers -->
        <circle cx="430" cy="55" r="4" fill="#0EA5E9" />
        <circle cx="550" cy="48" r="4" fill="#0284C7" />
    </g>
</svg>
