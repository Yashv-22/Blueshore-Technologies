<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <!-- Definitions for gradients and shadows -->
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCFCFD" />
            <stop offset="100%" stop-color="#EFF6FF" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5" />
            <stop offset="100%" stop-color="#6366F1" />
        </linearGradient>
        <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F97316" />
            <stop offset="100%" stop-color="#FB923C" />
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0EA5E9" />
            <stop offset="100%" stop-color="#38BDF8" />
        </linearGradient>
        <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.0" />
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.04" />
        </filter>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
        </filter>
    </defs>

    <!-- Background Canvas -->
    <rect width="800" height="600" rx="16" fill="url(#bgGrad)" />

    <!-- Left Navigation Sidebar -->
    <rect x="0" y="0" width="180" height="600" rx="16" fill="#FFFFFF" filter="url(#shadow)" />
    
    <!-- Sidebar Branding (Cloud logo type) -->
    <rect x="28" y="28" width="24" height="24" rx="6" fill="url(#accentGrad)" />
    <path d="M34 42 A 4 4 0 0 1 34 34 A 6 6 0 0 1 45 34 A 4 4 0 0 1 45 42 Z" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" fill="none" />
    <rect x="62" y="32" width="80" height="8" rx="4" fill="#0F172A" />
    <rect x="62" y="44" width="50" height="5" rx="2" fill="#94A3B8" />

    <!-- Sidebar Menu Items -->
    <g transform="translate(20, 90)">
        <!-- Multi-Cloud (Active) -->
        <rect x="0" y="0" width="140" height="32" rx="8" fill="#EEF2FF" />
        <rect x="8" y="8" width="16" height="16" rx="4" fill="#4F46E5" />
        <rect x="36" y="12" width="70" height="8" rx="4" fill="#4338CA" />
        
        <!-- AWS Cloud Instances -->
        <g transform="translate(0, 44)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="75" height="8" rx="4" fill="#64748B" />
        </g>
        
        <!-- Azure Pools -->
        <g transform="translate(0, 80)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="65" height="8" rx="4" fill="#64748B" />
        </g>

        <!-- GCP Clusters -->
        <g transform="translate(0, 116)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="70" height="8" rx="4" fill="#64748B" />
        </g>
    </g>

    <!-- Top Navigation Header -->
    <rect x="180" y="0" width="620" height="70" fill="#FFFFFF" filter="url(#shadow)" />
    <!-- Page Title -->
    <text x="210" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Multi-Cloud Resilience Hub</text>
    <!-- Uptime Active Badge -->
    <rect x="520" y="24" width="80" height="22" rx="11" fill="#ECFDF5" />
    <circle cx="532" cy="35" r="4" fill="#10B981" />
    <text x="542" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#047857">99.999% UP</text>

    <!-- Main Content Area Grid -->
    
    <!-- Row 1: KPI Stats Cards -->
    <g transform="translate(200, 90)">
        <!-- Card 1: Cloud Providers -->
        <g transform="translate(10, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Vendor Platforms</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">AWS · AZ · GCP</text>
            <rect x="130" y="16" width="34" height="48" rx="6" fill="#EEF2FF" />
            <path d="M147 28 L138 44 H156 Z" fill="#4F46E5" />
        </g>

        <!-- Card 2: Failover Time -->
        <g transform="translate(205, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Automated Failover</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#10B981">&lt; 250ms</text>
            <circle cx="147" cy="40" r="18" fill="#ECFDF5" />
            <path d="M141 40 L145 44 L153 36" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </g>

        <!-- Card 3: Cloud Resources -->
        <g transform="translate(400, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Redundant Pods</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">1,850 Active</text>
            <circle cx="147" cy="40" r="18" fill="#FFFBEB" />
            <text x="143" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#F59E0B">☁</text>
        </g>
    </g>

    <!-- Row 2: Live Multi-cloud Failover Topology Map Panel -->
    <g transform="translate(210, 190)" filter="url(#cardShadow)">
        <rect width="570" height="240" rx="12" fill="#FFFFFF" />
        <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Multi-Cloud Multi-Region Failover Architecture Status</text>
        
        <!-- Interactive cloud connection visualization -->
        <rect x="20" y="50" width="530" height="170" rx="8" fill="#F8FAFC" />
        
        <!-- Failover Connection Links -->
        <path d="M110 135 Q 225 60 340 135" stroke="#4F46E5" stroke-width="3.5" fill="none" />
        <path d="M340 135 Q 225 210 110 135" stroke="#0EA5E9" stroke-width="2.5" stroke-dasharray="6,4" fill="none" />
        <path d="M110 135 L 225 100 L 340 135" stroke="#F97316" stroke-width="2" stroke-opacity="0.6" fill="none" />

        <!-- AWS Node -->
        <g transform="translate(90, 115)">
            <rect width="40" height="40" rx="20" fill="#FFF7ED" stroke="#F97316" stroke-width="2" />
            <text x="13" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#F97316">AWS</text>
        </g>

        <!-- Microsoft Azure Node -->
        <g transform="translate(320, 115)">
            <rect width="40" height="40" rx="20" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2" />
            <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#0EA5E9">AZ</text>
        </g>

        <!-- Google Cloud Platform Node -->
        <g transform="translate(205, 80)">
            <rect width="40" height="40" rx="20" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5" />
            <text x="11" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#4F46E5">GCP</text>
        </g>

        <!-- Gateway Status indicators -->
        <rect x="200" y="170" width="130" height="20" rx="10" fill="#ECFDF5" />
        <circle cx="210" cy="180" r="3.5" fill="#10B981" />
        <text x="220" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#047857">HEALTHY &amp; REDUNDANT</text>
    </g>

    <!-- Row 3: Load distribution across platforms -->
    <g transform="translate(210, 450)" filter="url(#cardShadow)">
        <rect width="570" height="130" rx="12" fill="#FFFFFF" />
        <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Enterprise Multi-Cloud Load Balancing Traffic Profile</text>
        
        <!-- Smooth area chart (scanning volume) -->
        <path d="M30 90 Q 110 70 190 85 T 350 40 T 510 65 L 550 45" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" />
        <path d="M30 90 Q 110 70 190 85 T 350 40 T 510 65 L 550 45 L 550 115 L 30 115 Z" fill="url(#chartGrad)" />
        
        <!-- Baseline lines -->
        <line x1="30" y1="115" x2="550" y2="115" stroke="#E2E8F0" stroke-width="1.5" />
        <line x1="30" y1="65" x2="550" y2="65" stroke="#F1F5F9" stroke-width="1" />
        <line x1="30" y1="35" x2="550" y2="35" stroke="#F1F5F9" stroke-width="1" />

        <circle cx="350" cy="40" r="4.5" fill="#4338CA" />
        <circle cx="550" cy="45" r="4.5" fill="#4F46E5" />
    </g>
</svg>
