<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <!-- Definitions for gradients and shadows -->
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCFCFD" />
            <stop offset="100%" stop-color="#FFFBEB" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>
        <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F43F5E" />
            <stop offset="100%" stop-color="#FB7185" />
        </linearGradient>
        <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0" />
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.04" />
        </filter>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
        </filter>
    </defs>

    <!-- Background Canvas -->
    <rect width="800" height="600" rx="16" fill="url(#bgGrad)" />

    <!-- Left Navigation Sidebar -->
    <rect x="0" y="0" width="180" height="600" rx="16" fill="#FFFFFF" filter="url(#shadow)" />
    
    <!-- Sidebar Branding (E-Commerce basket or chart logo type) -->
    <rect x="28" y="28" width="24" height="24" rx="6" fill="url(#accentGrad)" />
    <path d="M33 34 H47 L44 43 H36 Z M36 43 L34 47 H46 M39 34 V32 A2 2 0 0 1 41 30 H41 A2 2 0 0 1 43 32 V34" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <rect x="62" y="32" width="80" height="8" rx="4" fill="#0F172A" />
    <rect x="62" y="44" width="50" height="5" rx="2" fill="#94A3B8" />

    <!-- Sidebar Menu Items -->
    <g transform="translate(20, 90)">
        <!-- Storefront (Active) -->
        <rect x="0" y="0" width="140" height="32" rx="8" fill="#FEF3C7" />
        <rect x="8" y="8" width="16" height="16" rx="4" fill="#F59E0B" />
        <rect x="36" y="12" width="70" height="8" rx="4" fill="#D97706" />
        
        <!-- Cart Operations -->
        <g transform="translate(0, 44)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="60" height="8" rx="4" fill="#64748B" />
        </g>
        
        <!-- Holiday Sales Campaign -->
        <g transform="translate(0, 80)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="80" height="8" rx="4" fill="#64748B" />
        </g>

        <!-- Dynamic Catalog -->
        <g transform="translate(0, 116)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="65" height="8" rx="4" fill="#64748B" />
        </g>

        <!-- Checkout Analytics -->
        <g transform="translate(0, 152)">
            <rect x="8" y="8" width="16" height="16" rx="4" fill="#E2E8F0" />
            <rect x="36" y="12" width="75" height="8" rx="4" fill="#64748B" />
        </g>
    </g>

    <!-- Top Navigation Header -->
    <rect x="180" y="0" width="620" height="70" fill="#FFFFFF" filter="url(#shadow)" />
    <!-- Page Title -->
    <text x="210" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Retail Composable Commerce Engine</text>
    <!-- Event Banner -->
    <rect x="480" y="24" width="110" height="22" rx="11" fill="#FEE2E2" />
    <circle cx="492" cy="35" r="4" fill="#EF4444" />
    <text x="502" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#EF4444">HOLIDAY PEAK</text>

    <!-- Main Content Area Grid -->
    
    <!-- Row 1: E-Commerce Stats -->
    <g transform="translate(200, 90)">
        <!-- Card 1: Traffic Volume -->
        <g transform="translate(10, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Daily Sales Requests</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">50,420,180</text>
            <rect x="130" y="16" width="34" height="48" rx="6" fill="#FEF3C7" />
            <path d="M147 28 L138 44 H156 Z" fill="#F59E0B" />
        </g>

        <!-- Card 2: Performance Uptime -->
        <g transform="translate(205, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">System Downtime</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#10B981">0.000 ms</text>
            <circle cx="147" cy="40" r="18" fill="#ECFDF5" />
            <path d="M141 40 L145 44 L153 36" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none" />
        </g>

        <!-- Card 3: Direct Sales conversion -->
        <g transform="translate(400, 0)" filter="url(#cardShadow)">
            <rect width="180" height="80" rx="12" fill="#FFFFFF" />
            <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Conversion Growth</text>
            <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">+24.8%</text>
            <circle cx="147" cy="40" r="18" fill="#FFF1F2" />
            <path d="M147 28 V52 M138 37 L147 28 L156 37" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" fill="none" transform="rotate(45 147 40)" />
        </g>
    </g>

    <!-- Row 2: Active Inventory Checkout Monitor -->
    <g transform="translate(210, 190)" filter="url(#cardShadow)">
        <rect width="570" height="240" rx="12" fill="#FFFFFF" />
        <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Multi-Tenant Store Checkout Conversions &amp; Cart Performance</text>
        
        <!-- Store checkout progress representation -->
        <g transform="translate(20, 50)">
            <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#64748B">ACTIVE TENANT STORES</text>
            
            <!-- Store 1 -->
            <g transform="translate(0, 30)">
                <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Fashion Global Store</text>
                <rect x="130" y="2" width="280" height="12" rx="6" fill="#F1F5F9" />
                <rect x="130" y="2" width="240" height="12" rx="6" fill="url(#accentGrad)" />
                <text x="420" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">85% Conv</text>
            </g>
            
            <!-- Store 2 -->
            <g transform="translate(0, 75)">
                <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Smart Tech Electronics</text>
                <rect x="130" y="2" width="280" height="12" rx="6" fill="#F1F5F9" />
                <rect x="130" y="2" width="210" height="12" rx="6" fill="url(#roseGrad)" />
                <text x="420" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">75% Conv</text>
            </g>

            <!-- Store 3 -->
            <g transform="translate(0, 120)">
                <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Living Luxury Goods</text>
                <rect x="130" y="2" width="280" height="12" rx="6" fill="#F1F5F9" />
                <rect x="130" y="2" width="260" height="12" rx="6" fill="url(#accentGrad)" />
                <text x="420" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">92% Conv</text>
            </g>
        </g>
    </g>

    <!-- Row 3: Hourly Sales Spike Chart Panel -->
    <g transform="translate(210, 450)" filter="url(#cardShadow)">
        <rect width="570" height="130" rx="12" fill="#FFFFFF" />
        <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Hourly Transaction Volumes (Extreme Holiday Sales Peak)</text>
        
        <!-- Sharp spikes line chart -->
        <path d="M30 90 L 100 85 L 170 95 L 240 60 L 310 100 L 380 30 L 450 85 L 510 20 L 550 15" fill="none" stroke="#F59E0B" stroke-width="3" />
        <path d="M30 90 L 100 85 L 170 95 L 240 60 L 310 100 L 380 30 L 450 85 L 510 20 L 550 15 L 550 115 L 30 115 Z" fill="url(#chartGrad)" />
        
        <!-- Grid lines -->
        <line x1="30" y1="115" x2="550" y2="115" stroke="#E2E8F0" stroke-width="1.5" />
        <line x1="30" y1="65" x2="550" y2="65" stroke="#F1F5F9" stroke-width="1" />
        <line x1="30" y1="35" x2="550" y2="35" stroke="#F1F5F9" stroke-width="1" />

        <circle cx="380" cy="30" r="4.5" fill="#D97706" />
        <circle cx="510" cy="20" r="4.5" fill="#F59E0B" />
    </g>
</svg>
