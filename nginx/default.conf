# Nginx Hardening Configuration

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

upstream django_app {
    server web:8000;
}

# Redirect all HTTP traffic from old domain to new HTTPS domain
server {
    listen 80;
    server_name blueshoretechnologies.com www.blueshoretechnologies.com;
    server_tokens off;
    return 301 https://www.blueshoretech.com$request_uri;
}

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name blueshoretech.com www.blueshoretech.com;
    
    # Disable showing Nginx version
    server_tokens off;

    # Block Bad Bots & Scrapers (Except Screaming Frog)
    set $block_bot 0;
    if ($http_user_agent ~* (SemrushBot|DotBot|AhrefsBot|PetalBot|MJ12bot|MauiBot|crawler|spider|yahoo)) {
        set $block_bot 1;
    }
    if ($http_user_agent ~* "Screaming Frog") {
        set $block_bot 0;
    }
    if ($block_bot = 1) {
        return 403;
    }

    location / {
        return 301 https://www.blueshoretech.com$request_uri;
    }
}

# Main HTTPS Server Configuration
server {
    listen 443 ssl http2;
    server_name www.blueshoretech.com blueshoretech.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/blueshoretech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blueshoretech.com/privkey.pem;

    # SSL Parameters & Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Apply general rate limiting
    limit_req zone=general_limit burst=50 nodelay;

    # Payload size limits (10MB maximum to match Django upload configuration)
    client_max_body_size 10M;

    # Timeouts to mitigate slowloris attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Disable showing Nginx version
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https://*.amazonaws.com; connect-src 'self' https://api.github.com ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Block Bad Bots & Scrapers (Except Screaming Frog)
    set $block_bot 0;
    if ($http_user_agent ~* (SemrushBot|DotBot|AhrefsBot|PetalBot|MJ12bot|MauiBot|crawler|spider|yahoo)) {
        set $block_bot 1;
    }
    if ($http_user_agent ~* "Screaming Frog") {
        set $block_bot 0;
    }
    if ($block_bot = 1) {
        return 403;
    }

    # Serve favicon.ico directly
    location = /favicon.ico {
        alias /app/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Static assets serving
    location /assets/ {
        alias /app/assets/;
        autoindex off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Media uploads serving (with script execution protection)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Block execution of script extensions in uploads directory
        location ~* \.(php|pl|py|jsp|sh|cgi|exe|bat|js)$ {
            return 403;
        }
        
        access_log off;
    }

    # API endpoints throttling
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Chatbot endpoint specific throttling
    location /api/chatbot/ {
        limit_req zone=chat_limit burst=5 nodelay;
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Proxy WebSocket requests to Django Daphne server
    location /ws/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Proxy all other requests to Django Gunicorn server
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
